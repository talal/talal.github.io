<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Muhammad Talal Anwar</title>
		<meta name="description" content="Personal website of Muhammad Talal Anwar">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<link rel="canonical" href="https://mtalalanwar.com/">
		<link rel="icon" href="favicon.ico" sizes="any">
		<style>
			:root {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				color-scheme: light dark;
			}

			body {
				margin: 0;
				padding: 10rem 2rem 4rem 4rem;
				background-color: #ffffff;
				color: #171717;
			}

			main {
				max-width: 800px;
			}

			@media (max-width: 640px) {
				body {
					padding: 4rem 1.5rem;
				}
			}

			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			.links-list {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: 1.5rem;
			}

			.links-list li {
				font-size: 36px;
				font-weight: 400;
				letter-spacing: 0.25px;
			}

			a {
				color: inherit;
				text-decoration: none;
				text-underline-offset: 5px;
				border-bottom: 4px solid currentColor;
				transition: border-color 0.15s, color 0.15s;
			}

			a:hover {
				color: #0055ff;
				border-bottom-color: transparent;
				text-decoration: underline wavy #171717;
				text-underline-offset: 9px;
			}

			a:focus-visible {
				color: #0055ff;
				border-bottom-color: transparent;
				text-decoration: underline wavy #171717;
				text-underline-offset: 9px;
				outline: 2px solid currentColor;
				outline-offset: 6px;
				border-radius: 2px;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background-color: #171717;
					color: #cccccc;
				}

				a:hover,
				a:focus-visible {
					color: #66b3ff;
					text-decoration-color: #cccccc;
				}
			}
		</style>
	</head>

	<body>
		<main>
			<h1 class="sr-only">Muhammad Talal Anwar</h1>
			<nav aria-label="Personal links">
				<ul class="links-list">
					<li><a href="https://github.com/talal" rel="me">GitHub</a></li>
					<li><a href="https://tangled.org/talal.dev" rel="me">Tangled</a></li>
					<li><a href="https://orcid.org/0009-0007-9477-0055" rel="me">ORCID</a></li>
					<li><a href="https://www.linkedin.com/in/m-t-anwar" rel="me">LinkedIn</a></li>
				</ul>
			</nav>
		</main>
	</body>
</html>
